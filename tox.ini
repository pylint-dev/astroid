[tox]
envlist = py{39,310,311,312,313,314,315}
skip_missing_interpreters = true
isolated_build = true

[testenv]
deps =
  -r requirements_full.txt
commands =
  pytest --cov {posargs}

[testenv:formatting]
deps =
    -r requirements_dev.txt
commands =
    pre-commit run --all-files

[testenv:docs]
skipsdist = True
usedevelop = True
changedir = doc/
deps =
    -r doc/requirements.txt
commands =
    sphinx-build -E -W -j auto -b html . build

[testenv:linkcheck]
skipsdist = True
usedevelop = True
changedir = doc/
deps =
    -r doc/requirements.txt
commands =
    sphinx-build -E -W -b linkcheck . build/linkcheck
