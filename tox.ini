[tox]
minversion = 4.22
envlist = py{311,312,313,314,315}
skip_missing_interpreters = true
isolated_build = true

[testenv]
dependency_groups = test
commands =
  pytest --cov {posargs}

[testenv:formatting]
dependency_groups = lint
commands =
    pre-commit run --all-files

[testenv:docs]
skipsdist = True
usedevelop = True
changedir = doc/
dependency_groups = docs
commands =
    sphinx-build -E -W -j auto -b html . build

[testenv:doctest]
skipsdist = True
usedevelop = True
changedir = doc/
# Same interpreter as Read the Docs, for the reason given in .readthedocs.yaml.
# On an older one the template string examples fail instead of being checked.
basepython = python3.14
dependency_groups = docs
commands =
    sphinx-build -E -W -b doctest . build/doctest

[testenv:linkcheck]
skipsdist = True
usedevelop = True
changedir = doc/
dependency_groups = docs
commands =
    sphinx-build -E -W -b linkcheck . build/linkcheck
