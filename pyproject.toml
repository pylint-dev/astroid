[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "astroid"
description = "An abstract syntax tree for Python with inference support."
readme = "README.rst"
keywords = [ "abstract syntax tree", "python", "static code analysis" ]
license = "LGPL-2.1-OR-later"
license-files = [ "LICENSE", "CONTRIBUTORS.txt" ]
requires-python = ">=3.11.0"
classifiers = [
  "Development Status :: 6 - Mature",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dynamic = [ "version" ]
urls."Bug tracker" = "https://github.com/pylint-dev/astroid/issues"
urls."Discord server" = "https://discord.gg/Egy6P8AMB5"
urls.Docs = "https://pylint.readthedocs.io/projects/astroid/en/latest/"
urls."Source Code" = "https://github.com/pylint-dev/astroid"

[dependency-groups]
dev = [
  # Tools used when releasing
  "contributors-txt>=1.1.3",
  "tbump~=6.11",
  "towncrier>=26.9",
]
test = [
  # Packages used to run additional tests
  "attrs",
  "numpy>=2.4.6,<3; python_version<'3.12'",
  "pyqt6",
  "python-dateutil",
  "regex",
  # ``tests/testdata/python3/data/path_pkg_resources_1`` declares its
  # namespace via ``pkg_resources``; pin setuptools to versions that still
  # ship it (removed in 82.0.0). Applies on every supported Python.
  "setuptools<82",
  "six",
  "typing-extensions>=4.16",
  "urllib3>=1.26.20,<2",
  { include-group = "test-min" },
]
docs = [
  "furo==2025.12.19",
  "sphinx~=8.1",
]
lint = [
  # Tools used during development, prefer running these with pre-commit
  "black",
  "pre-commit",
  "pylint>=4.1.3",
  "ruff",
]
test-min = [
  # Tools used to run tests
  "coverage[toml]~=7.16",
  "mypy; platform_python_implementation!='PyPy'",
  "pytest",
  "pytest-cov~=7.1",
]

[tool.setuptools]
dynamic.version = { attr = "astroid.__pkginfo__.__version__" }
package-dir."" = "."
packages.find.include = [ "astroid*" ]

[tool.ruff]
target-version = "py311"
# ruff is less lenient than pylint and does not make any exceptions
# (for docstrings, strings and comments in particular).
line-length = 110
extend-exclude = [ "tests/testdata/" ]
lint.select = [
  "B",   # bugbear
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "B905",   # `zip()` without an explicit `strict=` parameter
  "F401",   # API
  "RUF100", # ruff does not understand pylint's directive usefulness
]
# Ruff is autofixing a tests with a voluntarily sneaky unicode
lint.per-file-ignores."tests/test_regrtest.py" = [ "RUF001" ]
lint.fixable = [
  "B",   # bugbear
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.unfixable = [ "RUF001" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.pytest]
ini_options.addopts = '-m "not acceptance"'
ini_options.python_files = [ "*test_*.py" ]
ini_options.testpaths = [ "tests" ]
ini_options.filterwarnings = "error"
ini_options.xfail_strict = true

[tool.coverage]
run.branch = true
run.relative_files = true
report.omit = [
  "*/astroid/__main__.py",
  "*/tests/*",
  "*/tmp*/*",
]
report.exclude_lines = [
  # Re-enable default pragma
  "pragma: no cover",
  # Debug-only code
  "def __repr__",
  # Type checking code not executed during pytest runs
  "if TYPE_CHECKING:",
  # Overload signatures are only read by type checkers
  "@overload",
  # Abstract methods
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = [
  "astroid/__main__.py",
  "astroid/__pkginfo__.py",
  "astroid/_ast.py",
  "astroid/astroid_manager.py",
  "astroid/brain/__init__.py",
  "astroid/brain/brain_crypt.py",
  "astroid/brain/brain_ctypes.py",
  "astroid/brain/brain_curses.py",
  "astroid/brain/brain_datetime.py",
  "astroid/brain/brain_dateutil.py",
  "astroid/brain/brain_decimal.py",
  "astroid/brain/brain_hashlib.py",
  "astroid/brain/brain_http.py",
  "astroid/brain/brain_hypothesis.py",
  "astroid/brain/brain_mechanize.py",
  "astroid/brain/brain_numpy_core_einsumfunc.py",
  "astroid/brain/brain_numpy_core_fromnumeric.py",
  "astroid/brain/brain_numpy_core_function_base.py",
  "astroid/brain/brain_numpy_core_multiarray.py",
  "astroid/brain/brain_numpy_core_numeric.py",
  "astroid/brain/brain_numpy_core_numerictypes.py",
  "astroid/brain/brain_numpy_core_umath.py",
  "astroid/brain/brain_numpy_ma.py",
  "astroid/brain/brain_numpy_random_mtrand.py",
  "astroid/brain/brain_pkg_resources.py",
  "astroid/brain/brain_pytest.py",
  "astroid/brain/brain_responses.py",
  "astroid/brain/brain_scipy_signal.py",
  "astroid/brain/brain_sqlalchemy.py",
  "astroid/brain/brain_ssl.py",
  "astroid/brain/brain_subprocess.py",
  "astroid/brain/brain_threading.py",
  "astroid/brain/brain_type.py",
  "astroid/brain/brain_unittest.py",
  "astroid/brain/brain_uuid.py",
  "astroid/const.py",
  "astroid/context.py",
  "astroid/interpreter/__init__.py",
  "astroid/interpreter/_import/",
  "astroid/modutils.py",
  "astroid/nodes/const.py",
  "astroid/nodes/scoped_nodes/__init__.py",
  "astroid/nodes/utils.py",
  "astroid/transforms.py",
  "astroid/typing.py",
]
always_false = [
  "PY312_PLUS",
  "PY313_PLUS",
]
disallow_any_decorated = true
disallow_any_explicit = true
follow_imports = "silent"
scripts_are_modules = true
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = false

[[tool.mypy.overrides]]
# Importlib typeshed stubs do not include the private functions we use
module = [
  "_io.*",
  "gi.*",
  "importlib.*",
  "numpy.*",
  "pytest",
  "setuptools",
]
ignore_missing_imports = true

[tool.pyright]
include = [ "astroid" ]
# Files with errors to fix. Remove a file from this list once it is clean.
exclude = [
  "astroid/arguments.py",
  "astroid/bases.py",
  "astroid/brain/brain_argparse.py",
  "astroid/brain/brain_attrs.py",
  "astroid/brain/brain_boto3.py",
  "astroid/brain/brain_builtin_inference.py",
  "astroid/brain/brain_collections.py",
  "astroid/brain/brain_dataclasses.py",
  "astroid/brain/brain_functools.py",
  "astroid/brain/brain_gi.py",
  "astroid/brain/brain_hashlib.py",
  "astroid/brain/brain_hypothesis.py",
  "astroid/brain/brain_io.py",
  "astroid/brain/brain_multiprocessing.py",
  "astroid/brain/brain_namedtuple_enum.py",
  "astroid/brain/brain_numpy_core_numerictypes.py",
  "astroid/brain/brain_numpy_ndarray.py",
  "astroid/brain/brain_numpy_utils.py",
  "astroid/brain/brain_pathlib.py",
  "astroid/brain/brain_qt.py",
  "astroid/brain/brain_random.py",
  "astroid/brain/brain_re.py",
  "astroid/brain/brain_regex.py",
  "astroid/brain/brain_six.py",
  "astroid/brain/brain_statistics.py",
  "astroid/brain/brain_typing.py",
  "astroid/brain/brain_uuid.py",
  "astroid/brain/helpers.py",
  "astroid/builder.py",
  "astroid/constraint.py",
  "astroid/filter_statements.py",
  "astroid/helpers.py",
  "astroid/interpreter/_import/spec.py",
  "astroid/interpreter/objectmodel.py",
  "astroid/manager.py",
  "astroid/nodes/_base_nodes.py",
  "astroid/nodes/as_string.py",
  "astroid/nodes/node_classes.py",
  "astroid/nodes/node_ng.py",
  "astroid/nodes/scoped_nodes/mixin.py",
  "astroid/nodes/scoped_nodes/scoped_nodes.py",
  "astroid/nodes/scoped_nodes/utils.py",
  "astroid/objects.py",
  "astroid/protocols.py",
  "astroid/raw_building.py",
  "astroid/rebuilder.py",
  "astroid/test_utils.py",
  "astroid/util.py",
]
pythonVersion = "3.11"

[tool.aliases]

test = "pytest"
